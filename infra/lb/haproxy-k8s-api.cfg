# ---------------------------------------------------------------------------
# HAProxy addition for the homelab front-end load balancer (192.168.15.113)
# -> Kubernetes API (kube-apiserver) TCP passthrough to the control plane.
#
# How to use: append this block to the EXISTING backend frontend section of
# /etc/haproxy/haproxy.cfg on the LB, then:
#       haproxy -c -f /etc/haproxy/haproxy.cfg   # validate
#       systemctl reload haproxy
#
# Cilium (Fase 3) is deployed with k8sServiceHost=192.168.15.113, so this
# frontend MUST be active before the cilium apply, otherwise the Cilium
# agent DaemonSet cannot reach the API server and nodes never become Ready.
# ---------------------------------------------------------------------------

# --- Kubernetes API (Fase 3): TCP 6443 -> control plane nodes ---------------
frontend k8s_api
    bind *:6443
    mode tcp
    default_backend k8s_backend

backend k8s_backend
    mode tcp
    balance roundrobin
    timeout tunnel 1h
    server kum1 192.168.15.220:6443 check
    server kum2 192.168.15.221:6443 check
    server kum3 192.168.15.222:6443 check